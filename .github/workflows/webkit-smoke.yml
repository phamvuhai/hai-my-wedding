name: Safari engine smoke
on:
  pull_request:
  push:
    branches:
      - 'refactor/atelier-*'
  workflow_dispatch:
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit browser and its dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps webkit
      - name: Test iPhone-like Safari browser
        run: node tools/audit-webkit.mjs
      - name: Upload screenshots and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-smoke-report
          path: webkit-audit/
          retention-days: 14
