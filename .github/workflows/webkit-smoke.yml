name: Safari engine smoke
on:
  pull_request:
  push:
    branches:
      - 'refactor/atelier-*'
  workflow_dispatch:
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check photo and website JavaScript syntax
        run: |
          node --check assets/js/admin/photo-processor.js
          node --check assets/js/admin/editor.js
          node --check assets/js/admin/bulk-upload.js
          node --check assets/js/admin/photo-sort.js
          node --check assets/js/admin/library.js
          node --check assets/js/site/app.js
          node --check tools/audit-album-bulk.mjs
          node --check assets/js/site/romantic-motion.js
          node --check assets/js/site/i18n.js
          node --check tools/audit-romantic-motion.mjs
          node --check assets/js/site/adaptive-images.js
          node --check assets/js/site/wedding.js
          node --check assets/js/admin/image-backfill.js
          node --check tools/audit-adaptive-images.mjs
      - name: Install WebKit browser and its dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps webkit
      - name: Test bulk photo import and sorting with mocked Supabase
        run: node tools/audit-album-bulk.mjs
      - name: Test new romantic motion without production data
        run: node tools/audit-romantic-motion.mjs
      - name: Test adaptive images on Safari with mock-only Supabase
        run: node tools/audit-adaptive-images.mjs
      - name: Test iPhone-like Safari browser
        run: node tools/audit-webkit.mjs
      - name: Test touch experience and mocked invited guests
        run: node tools/audit-touch.mjs
      - name: Upload screenshots and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-smoke-report
          path: |
            webkit-audit/
            touch-audit/
          retention-days: 14
