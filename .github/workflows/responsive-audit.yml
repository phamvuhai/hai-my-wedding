name: Responsive browser audit
on:
  pull_request:
  push:
    branches:
      - 'refactor/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install browser audit dependencies
        run: npm install --no-save --package-lock=false puppeteer-core@24.25.0 postcss@8.5.6
      - name: Capture screenshots and CSS coverage
        run: node tools/audit-runtime.mjs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-css-audit
          path: runtime-audit/
          retention-days: 14
