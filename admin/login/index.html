<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin Login | Hải & Mỹ</title>
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <main class="login-page">
    <section class="visual">
      <a class="brand" href="../../">H & M</a>
      <div class="visual-copy">
        <p class="eyebrow">WEDDING ADMIN</p>
        <h1>Hải & Mỹ</h1>
        <p>Không gian quản trị riêng cho website cưới.</p>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <p class="eyebrow dark">PRIVATE CMS</p>
        <h2 id="formTitle">Đăng nhập Admin</h2>
        <p class="subtitle" id="formSubtitle">Nhập tài khoản quản trị để tiếp tục.</p>

        <form id="loginForm">
          <label>Email<input id="email" type="email" autocomplete="email" required /></label>
          <label>Mật khẩu
            <div class="password-field">
              <input id="password" type="password" minlength="8" autocomplete="current-password" required />
              <button id="togglePassword" type="button">Hiện</button>
            </div>
          </label>
          <button class="primary" type="submit">Đăng nhập</button>
          <button class="link-btn" id="forgotBtn" type="button">Quên mật khẩu?</button>
          <p id="status" class="status" aria-live="polite"></p>
        </form>

        <form id="resetForm" class="hidden">
          <label>Mật khẩu mới
            <div class="password-field">
              <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required />
              <button id="toggleNewPassword" type="button">Hiện</button>
            </div>
          </label>
          <label>Nhập lại mật khẩu mới<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
          <button class="primary" type="submit">Lưu mật khẩu mới</button>
          <p id="resetStatus" class="status" aria-live="polite"></p>
        </form>

        <a class="back" href="../../">← Quay lại website</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../config.js"></script>
  <script src="./login.js"></script>
</body>
</html>
