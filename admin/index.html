<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin RSVP | Hải & Mỹ</title>
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <main class="shell">
    <section id="loginView" class="auth-card">
      <div class="brand">H & M</div>
      <p class="eyebrow">WEDDING ADMIN</p>
      <h1>Quản lý RSVP</h1>
      <p class="muted">Nhập email quản trị để nhận liên kết đăng nhập an toàn.</p>
      <form id="loginForm" class="stack">
        <label>Email quản trị
          <input id="email" name="email" type="email" autocomplete="email" required />
        </label>
        <button type="submit" class="btn primary">Gửi Magic Link</button>
        <p id="loginStatus" class="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="dashboardView" class="dashboard hidden">
      <header class="topbar">
        <div><p class="eyebrow">HẢI & MỸ</p><h1>RSVP Admin</h1></div>
        <div class="top-actions">
          <span id="adminEmail" class="user-chip"></span>
          <button id="refreshBtn" class="btn">Làm mới</button>
          <button id="exportBtn" class="btn">Export CSV</button>
          <button id="logoutBtn" class="btn danger">Đăng xuất</button>
        </div>
      </header>

      <section class="stats-grid">
        <article class="stat"><span>Tổng phản hồi</span><strong id="statTotal">0</strong></article>
        <article class="stat"><span>Tham dự</span><strong id="statYes">0</strong></article>
        <article class="stat"><span>Không tham dự</span><strong id="statNo">0</strong></article>
        <article class="stat"><span>Tổng số khách</span><strong id="statGuests">0</strong></article>
      </section>

      <section class="panel">
        <div class="filters">
          <input id="searchInput" type="search" placeholder="Tìm theo tên hoặc số điện thoại..." />
          <select id="attendanceFilter">
            <option value="">Tất cả phản hồi</option>
            <option value="yes">Có tham dự</option>
            <option value="no">Không tham dự</option>
            <option value="maybe">Chưa chắc chắn</option>
          </select>
          <select id="eventFilter">
            <option value="">Tất cả sự kiện</option>
            <option value="bride">Nhà gái</option>
            <option value="groom">Nhà trai</option>
            <option value="both">Cả hai</option>
          </select>
        </div>
        <p id="dataStatus" class="status" aria-live="polite"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Khách mời</th><th>Điện thoại</th><th>Tham dự</th><th>Số khách</th><th>Sự kiện</th><th>Lời nhắn</th><th>Thời gian</th></tr></thead>
            <tbody id="rsvpBody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty hidden">Chưa có dữ liệu phù hợp.</div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
