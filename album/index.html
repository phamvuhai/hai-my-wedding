<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f3ee" />
  <title>Album | Hải & Mỹ</title>
  <link rel="stylesheet" href="./album.css" />
</head>
<body>
  <header class="album-hero">
    <nav class="album-nav shell">
      <a class="brand" href="../">H & M</a>
      <a class="back" href="../">← Về thiệp cưới</a>
    </nav>
    <div class="album-hero-copy shell">
      <p class="eyebrow">OUR MEMORIES</p>
      <h1>Album của Hải & Mỹ</h1>
      <p>Những khoảnh khắc chúng tôi muốn lưu lại cùng nhau.</p>
    </div>
  </header>
  <main class="shell album-main">
    <div id="albumFilters" class="filters" aria-label="Bộ lọc album"></div>
    <p id="albumStatus" class="status">Đang tải album...</p>
    <section id="gallery" class="masonry" aria-live="polite"></section>
  </main>
  <dialog id="lightbox" class="lightbox">
    <button id="lightboxClose" class="icon-btn close-btn" aria-label="Đóng">×</button>
    <button id="lightboxPrev" class="icon-btn nav-btn prev" aria-label="Ảnh trước">‹</button>
    <figure><img id="lightboxImage" alt="" /><figcaption id="lightboxCaption"></figcaption></figure>
    <button id="lightboxNext" class="icon-btn nav-btn next" aria-label="Ảnh tiếp theo">›</button>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="./album.js"></script>
</body>
</html>
